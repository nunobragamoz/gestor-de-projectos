<div class="layout">

  <app-lista-projetos
    [projetos]="projetos()"
    [tarefas]="tarefas()"
    (novoProjeto)="novoProjeto()"
  />

  <div class="conteudo">

    <app-projeto-atual
      [projeto]="projetoSelecionado()"
      [tarefas]="tarefas()"
      [projetos]="projetos()"
      (editar)="editarProjeto()"
    />

    <app-barra-ferramentas
      [(pesquisa)]="pesquisa"
      [(prioridade)]="prioridade"
      (novaTarefa)="novaTarefa()"
    />

    <app-quadro
      [tarefas]="tarefasVisiveis()"
      [projetos]="projetos()"
      [mensagemVazia]="filtroAtivo() ? 'Sem resultados' : 'Sem tarefas'"
      (editar)="editarTarefa($event)"
    />

  </div>

</div>

<app-formulario-tarefa [projetos]="projetos()" />

<app-formulario-projeto />
