<section class="coluna" [attr.data-estado]="estado()">

  <header class="coluna-topo">
    <h2>{{ titulo() }}</h2>
    <span class="contador">{{ tarefas().length }}</span>
  </header>

  <div class="coluna-lista">

    @if (tarefas().length === 0) {
      <p class="coluna-vazia">{{ mensagemVazia() }}</p>
    }

    @for (tarefa of tarefas(); track tarefa.id) {
      <app-cartao-tarefa
        [tarefa]="tarefa"
        [projeto]="projetoDe(tarefa.projetoId)"
        (editar)="editar.emit($event)"
      />
    }

  </div>

</section>
