<dialog
  #dialogo
  id="modal-tarefa"
  class="modal"
  aria-labelledby="modal-titulo"
>

  <form
    id="form-tarefa"
    class="form"
    method="dialog"
    novalidate
    [formGroup]="form"
    (ngSubmit)="guardar($event)"
  >

    <h2 id="modal-titulo">Nova tarefa</h2>

    <input type="hidden" id="tarefa-id" />

    <label for="tarefa-titulo-input">
      Título <span aria-hidden="true">*</span>
    </label>

    <input
      #campoTitulo
      type="text"
      id="tarefa-titulo-input"
      class="campo"
      required
      maxlength="80"
      formControlName="titulo"
      [attr.aria-invalid]="erro() ? 'true' : null"
      (input)="erro.set(false)"
    />

    <p class="erro" id="erro-titulo" [hidden]="!erro()">
      O título é obrigatório.
    </p>

    <label for="tarefa-descricao-input">Descrição</label>

    <textarea
      id="tarefa-descricao-input"
      class="campo"
      rows="4"
      maxlength="500"
      formControlName="descricao"
    ></textarea>

    <label for="tarefa-projeto-input">Projeto</label>

    <select
      id="tarefa-projeto-input"
      class="campo"
      formControlName="projetoId"
    >
      @for (projeto of projetos(); track projeto.id) {
        <option [value]="projeto.id">{{ projeto.nome }}</option>
      }
    </select>

    <div class="form-linha">

      <div>

        <label for="tarefa-prioridade-input">Prioridade</label>

        <select
          id="tarefa-prioridade-input"
          class="campo"
          formControlName="prioridade"
        >
          @for (valor of ordem; track valor) {
            <option [value]="valor">
              {{ prioridades[valor] }}
            </option>
          }
        </select>

      </div>

      <div>

        <label for="tarefa-estado-input">Estado</label>

        <select
          id="tarefa-estado-input"
          class="campo"
          formControlName="estado"
        >
          @for (estado of estados; track estado.valor) {
            <option [value]="estado.valor">
              {{ estado.rotulo }}
            </option>
          }
        </select>

      </div>

    </div>

    <div class="form-acoes">

      <button
        type="button"
        id="btn-cancelar"
        class="btn"
        (click)="fechar()"
      >
        Cancelar
      </button>
      <button type="submit" class="btn btn-primario">
        Guardar
      </button>

    </div>

  </form>

</dialog>
